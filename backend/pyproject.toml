[project]
name = "nulltech-backend"
version = "0.1.0"
description = "NULL-TECH CIRCUIT STUDIO local service: webcam hand tracking -> input commands, ngspice runner"
requires-python = ">=3.10"
dependencies = ["websockets>=12"]

[project.optional-dependencies]
camera = ["opencv-python>=4.8", "mediapipe>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
nulltech-backend = "nulltech_backend.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nulltech_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
